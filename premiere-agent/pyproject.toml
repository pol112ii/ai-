[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pp-autocut"
version = "0.1.0"
description = "프리미어프로 자동 컷편집 에이전트 - 영상 분석부"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
]

[project.scripts]
pp-autocut = "pp_autocut.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
